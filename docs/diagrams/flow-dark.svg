<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="804" viewBox="0 0 1200 804" role="img" aria-labelledby="t d">
<title id="t">One booking through ai-scheduling-agent</title>
<desc id="d">Eight rows across the Person, Agent, Calendar, ChatModel and Approvals lanes. The person starts a run, the agent reads free slots from the calendar, the model proposes a booking and the agent holds it as a pending approval. The person approves, the agent writes with an idempotency key and answers. A warning row shows a crash after the write: the resume sends the same key and the calendar replays the first event.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="803" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="802" rx="16"/>
<text class="title" x="48" y="68">One booking, approved by a person</text>
<text class="caption" x="48" y="100">Amber: a crash after the write. Resume sends the same key, so the calendar answers with the first event.</text>

<rect class="actor" x="406" y="128" width="100" height="48" rx="24"/>
<text class="lane" x="456" y="158" text-anchor="middle">Person</text>
<rect class="svc" x="546" y="128" width="100" height="48" rx="10"/>
<text class="lane" x="596" y="158" text-anchor="middle">Agent</text>
<rect class="svc" x="691" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="746" y="158" text-anchor="middle">Calendar</text>
<rect class="svc" x="830" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="890" y="158" text-anchor="middle">ChatModel</text>
<rect class="svc" x="980" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1040" y="158" text-anchor="middle">Approvals</text>
<path class="hair" d="M456 176V720M596 176V720M746 176V640M890 176V368M1040 176V496"/>
<path class="hair" d="M66 216V696"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Create the run</text>
<text class="sub" x="96" y="232">recall up to 3 facts, save</text>
<path class="sync" d="M456 216H596"/>
<text class="label t-accent" x="468" y="206">agent run</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Read the free slots</text>
<text class="sub" x="96" y="296">the model asked; reads are free</text>
<path class="sync" d="M596 280H746"/>
<text class="label t-accent" x="608" y="270">find_free_slots</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3a</text>
<text class="label b t-ink" x="96" y="340">The model proposes a write</text>
<text class="sub" x="96" y="360">book_meeting, exact arguments</text>
<path class="sync" d="M890 344H596"/>
<text class="label t-accent" x="608" y="334">book_meeting</text>
<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3b</text>
<text class="label b t-ink" x="96" y="404">Hold it, do not write</text>
<text class="sub" x="96" y="424">audit: refused, no write</text>
<path class="sync" d="M596 408H1040"/>
<text class="label t-accent" x="608" y="398">pending</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="468">A person approves</text>
<text class="sub" x="96" y="488">agent approve --resume</text>
<path class="sync" d="M456 472H1040"/>
<text class="label t-accent" x="468" y="462">agent approve</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">Execute with the key</text>
<text class="sub" x="96" y="552">digest equals the proposal</text>
<text class="sub" x="96" y="572">Idempotency-Key: run + step</text>
<path class="sync" d="M596 536H746"/>
<text class="label t-accent" x="608" y="526">book</text>
<circle class="dot-w" cx="66" cy="616" r="15"/><text class="num" x="66" y="621" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="612">A crash after the write</text>
<text class="sub" x="96" y="632">SIGKILL before the checkpoint</text>
<text class="sub" x="96" y="652">resume sends the same key</text>
<path class="fail" d="M596 616H746"/>
<text class="label t-warn" x="608" y="606">same key</text>
<text class="label t-warn" x="608" y="636">replayed: true</text>
<circle class="dot-g" cx="66" cy="696" r="15"/><text class="num" x="66" y="701" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="692">Answer, run done</text>
<text class="sub" x="96" y="712">one sentence, status done</text>
<path class="ok" d="M596 696H456"/>
<text class="label t-good" x="468" y="686">done</text>
<rect class="win" x="660" y="676" width="420" height="40" rx="10"/>
<text class="label b t-good" x="676" y="701">1 event on the calendar, none twice</text>

<path class="sync" d="M48 760H112"/><text class="legend" x="124" y="765">sync call</text>
<path class="fail" d="M696 760H760"/><text class="legend" x="772" y="765">failure path</text>
<path class="ok" d="M928 760H992"/><text class="legend" x="1004" y="765">result</text>
</svg>

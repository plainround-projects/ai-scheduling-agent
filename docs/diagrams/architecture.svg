<text class="sub" x="1024" y="372" text-anchor="middle">events</text>
<text class="sub" x="1024" y="394" text-anchor="middle">idempotency keys</text>
<rect class="boundary" x="264" y="660" width="888" height="170" rx="14"/>
<text class="tag" x="280" y="688">Agent database: SQLite</text>
<path class="store" d="M288 718a96 12 0 0 1 192 0v102a96 12 0 0 1 -192 0z"/>
<path class="rim" d="M288 718a96 12 0 0 0 192 0"/>

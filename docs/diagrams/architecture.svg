<path class="store" d="M504 718a96 12 0 0 1 192 0v102a96 12 0 0 1 -192 0z"/>
<path class="rim" d="M504 718a96 12 0 0 0 192 0"/>
<text class="name" x="600" y="746" text-anchor="middle">Checkpoints</text>
<text class="sub" x="600" y="768" text-anchor="middle">runs, steps</text>
<text class="sub" x="600" y="790" text-anchor="middle">one transaction</text>

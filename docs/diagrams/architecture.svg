<text class="name" x="132" y="362" text-anchor="middle">Person</text>
<text class="sub" x="132" y="384" text-anchor="middle">agent CLI</text>
<rect class="svc" x="288" y="176" width="216" height="94" rx="12"/>
<text class="name" x="304" y="208">MemoryService</text>
<text class="sub" x="304" y="232">memory_service.py</text>
<text class="sub" x="304" y="254">recall 3 facts</text>
<rect class="svc" x="288" y="330" width="216" height="116" rx="12"/>
<text class="name" x="304" y="362">SchedulingAgent</text>
<text class="sub" x="304" y="386">agent.py</text>
<text class="sub" x="304" y="408">three budget caps</text>
<text class="sub" x="304" y="430">checkpoint per step</text>
<rect class="svc" x="288" y="490" width="216" height="94" rx="12"/>
<text class="name" x="304" y="522">ChatModel</text>
<text class="sub" x="304" y="546">scripted_policy.py</text>
<text class="sub" x="304" y="568">rule-based stand-in</text>
<rect class="svc" x="592" y="176" width="232" height="116" rx="12"/>
<text class="name" x="608" y="208">CalendarClient</text>
<text class="sub" x="608" y="232">calendar_client.py</text>
<text class="sub" x="608" y="254">Idempotency-Key header</text>
<text class="sub" x="608" y="276">timeouts, retries</text>
<rect class="svc" x="592" y="330" width="232" height="116" rx="12"/>
<text class="name" x="608" y="362">ToolBox</text>
<text class="sub" x="608" y="386">tools.py</text>
<text class="sub" x="608" y="408">reads, proposals</text>
<text class="sub" x="608" y="430">approval check, write</text>
<rect class="note" x="592" y="490" width="232" height="116" rx="10"/>
<text class="label b t-warn" x="608" y="520">SIGKILL, 4 points</text>
<text class="sub" x="608" y="546">and a clean run:</text>
<text class="sub" x="608" y="568">5 events, none twice</text>
<rect class="boundary" x="896" y="132" width="256" height="328" rx="14"/>
<text class="tag" x="912" y="160">Calendar service</text>
<rect class="svc" x="912" y="176" width="224" height="92" rx="12"/>
<text class="name" x="928" y="208">Calendar API</text>
<text class="sub" x="928" y="232">calendar_api.py</text>
<text class="sub" x="928" y="254">FastAPI, over HTTP</text>
<path class="store" d="M912 322a112 12 0 0 1 224 0v102a112 12 0 0 1 -224 0z"/>
<path class="rim" d="M912 322a112 12 0 0 0 224 0"/>

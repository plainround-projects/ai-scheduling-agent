[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scheduling-agent"
version = "0.1.0"
description = "A scheduling agent that books, moves and cancels meetings: approval for every write, budgets, crash-safe resumption and long-term memory."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = [
    "anthropic==2.3.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "httpx2",
]

[project.scripts]
agent = "scheduling_agent.interfaces.cli:main"
calendar-service = "scheduling_agent.interfaces.calendar_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tech"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "D100", "D101", "D103", "D104"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]
"scripts/**" = ["D", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "integration: runs the calendar service and the agent as real processes, including SIGKILL crashes",
    "e2e: the lesson's scenario end to end with the recorded model",
    "live: calls a real model; needs a key or a local server, run by `make test-live` only",
]

[tool.coverage.run]
source = ["scheduling_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "scheduling_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces on infrastructure on application on domain"
type = "layers"
layers = ["scheduling_agent.interfaces", "scheduling_agent.infrastructure", "scheduling_agent.application", "scheduling_agent.domain"]

[[tool.importlinter.contracts]]
name = "Domain and application never import a vendor SDK or an HTTP client"
type = "forbidden"
source_modules = ["scheduling_agent.domain", "scheduling_agent.application"]
forbidden_modules = ["anthropic", "httpx", "httpx2", "openai", "fastapi", "uvicorn", "sqlite3"]
